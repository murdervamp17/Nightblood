name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android export directory
        run: mkdir -p build

      - name: Export debug APK
        run: godot --headless --verbose --path . --export-debug "Android" build/nightblood-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightblood-debug-apk
          path: build/nightblood-debug.apk
          if-no-files-found: error
          retention-days: 14
