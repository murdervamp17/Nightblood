
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/nightblood-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nightblood-debug-apk
          path: build/nightblood-debug.apk
          if-no-files-found: error
          retention-days: 14
